[package]
name = "windterm-keymaps-editor"
version = "1.0.0"
edition = "2021"
rust-version = "1.74"
description = "WindTerm 快捷键配置文件（wind.keymaps）可视化编辑器 —— 轻量、简洁、美观、高效"
license = "MIT"
authors = ["WindTermKeyMapsEditor Contributors"]

[[bin]]
name = "WindTermKeyMapsEditor"
path = "src/main.rs"

[lib]
name = "windterm_keymaps_editor"
path = "src/lib.rs"

[dependencies]
eframe = "0.33"
egui = "0.33"
# egui 官方表格组件：其 `Table` 的 header 固定不随内容滚动，用于实现「固定标题栏」。
egui_extras = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
# 备份文件名使用本地时间戳（Local::now）。
chrono = "0.4"

[dev-dependencies]
# egui 官方成熟 GUI 测试框架（基于 kittest + AccessKit），用于驱动完整 eframe 应用做交互/回归测试。
egui_kittest = { version = "0.33", features = ["eframe"] }

[profile.release]
# 减小体积/提升性能
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
