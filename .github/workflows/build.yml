name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build:
    name: Test + Clippy + Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test --release

      - name: Build release
        run: cargo build --release --locked

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindTermKeyMapsEditor-windows-x86_64
          path: target/release/WindTermKeyMapsEditor.exe

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WindTermKeyMapsEditor-windows-x86_64
          path: dist

      # 生成发布说明（基于提交信息）
      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          {
            echo "## What's Changed"
            echo
            git log --oneline --no-merges "${{ github.event.release.target_commitish }}".. 2>/dev/null || true
          } > changes.txt || true

      - name: Zip distribution
        shell: pwsh
        run: |
          Compress-Archive -Path dist/WindTermKeyMapsEditor.exe -DestinationPath dist/windterm-keymaps-editor.zip -Force

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WindTermKeyMapsEditor.exe
            dist/windterm-keymaps-editor.zip
          generate_release_notes: true
          draft: false
          prerelease: false